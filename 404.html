<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Iterventions</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Same token discipline as index.html — no hex, font name, size or duration
     outside this block. Values mirror the canonical :root; keep them in sync. */
  :root{
    --c-bg-base:#0C0E10; --c-bg-inset:#090B0D; --c-border:#1E2226; --c-border-mid:#2C3038;
    --c-accent:#2ECC40; --c-accent-lo:#1A6E24; --c-warn:#FF6B35;
    --c-text-hi:#E4E8F0; --c-text:#9BA2B4; --c-text-lo:#555D6E;
    --c-page-grid:rgba(46,204,64,.022);
    --font-ui:'Space Grotesk',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
    --t-xs:.75rem; --t-sm:.875rem; --t-2xl:2.25rem;
    --sp-3:.75rem; --sp-4:1rem; --sp-6:1.5rem; --sp-8:2rem;
    --dur-fast:110ms;
    --bg-page:
      linear-gradient(var(--c-page-grid) 1px,transparent 1px) 0 0/100% 32px,
      linear-gradient(90deg,var(--c-page-grid) 1px,transparent 1px) 0 0/32px 100%,
      var(--c-bg-base);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:var(--sp-6);
    font-family:var(--font-ui);color:var(--c-text);line-height:1.6;
    background:var(--bg-page);
  }
  main{max-width:52ch;border:1px solid var(--c-border-mid);background:var(--c-bg-inset);padding:var(--sp-8)}
  .eyebrow{font-family:var(--font-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--c-warn);margin:0}
  h1{margin:var(--sp-4) 0 0;font-size:var(--t-2xl);letter-spacing:-.03em;font-weight:600;color:var(--c-text-hi);line-height:1.05}
  p{margin:var(--sp-4) 0 0}
  a{display:inline-block;margin-top:var(--sp-6);font-family:var(--font-mono);font-size:var(--t-sm);
    letter-spacing:.08em;color:var(--c-accent);text-decoration:none;
    border:1px solid var(--c-accent-lo);padding:var(--sp-3) var(--sp-4);
    transition:border-color var(--dur-fast),color var(--dur-fast)}
  a:hover{border-color:var(--c-accent);color:var(--c-text-hi)}
  a:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
  .fn{font-family:var(--font-mono);font-size:var(--t-xs);color:var(--c-text-lo);margin-top:var(--sp-6)}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">// 404 · no such route</p>
  <h1>This one isn't documented yet.</h1>
  <p>Which is on brand, but not intentional. The page you asked for doesn't exist — or it existed in a
     previous version and did not survive the iteration.</p>
  <a href="/">&larr; back to the log</a>
  <p class="fn">iterventions.com &middot; nothing here is finished on purpose</p>
</main>
</body>
</html>
