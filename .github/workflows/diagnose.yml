# Throwaway diagnostic. Reports the SHAPE of the Cloudflare secrets —
# length, character class, stray whitespace — and never their contents.
# Delete this file once the deploy is green.

name: Diagnose secret shape

on:
  # workflow_dispatch is only exposed for workflows that exist on the
  # default branch, so this runs on push to its own branch instead.
  push:
    branches: [fix/deploy-secret-shape]
  workflow_dispatch:

jobs:
  shape:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        env:
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "--- CLOUDFLARE_ACCOUNT_ID ---"
          echo "present:        $([ -n "$ACC" ] && echo yes || echo NO)"
          echo "length:         ${#ACC}   (expected 32)"
          TRIM_ACC="$(printf '%s' "$ACC" | tr -d '[:space:]')"
          echo "length trimmed: ${#TRIM_ACC}"
          if [ "${#ACC}" -ne "${#TRIM_ACC}" ]; then
            echo "VERDICT:        contains whitespace — this is the bug"
          elif printf '%s' "$ACC" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "VERDICT:        well-formed 32-char lowercase hex"
          else
            echo "VERDICT:        wrong shape — not 32 lowercase hex chars"
          fi

          echo ""
          echo "--- are they the same value? ---"
          A_H="$(printf '%s' "$ACC" | sha256sum | cut -c1-8)"
          T_H="$(printf '%s' "$TOK" | sha256sum | cut -c1-8)"
          [ "$A_H" = "$T_H" ] && echo "IDENTICAL — the same string is in both secrets" \
                              || echo "different values"

          echo ""
          echo "--- character classes in ACCOUNT_ID (no content) ---"
          for c in / : . - _ ' ' '"' "'" '=' '?'; do
            n="$(printf '%s' "$ACC" | tr -cd "$c" | wc -c)"
            [ "$n" -gt 0 ] && echo "contains $n of [$c]"
          done
          echo "hex chars:   $(printf '%s' "$ACC" | tr -cd '0-9a-f' | wc -c) of ${#ACC}"
          echo "uppercase:   $(printf '%s' "$ACC" | tr -cd 'A-Z'    | wc -c)"

          echo ""
          echo "--- CLOUDFLARE_API_TOKEN ---"
          echo "present:        $([ -n "$TOK" ] && echo yes || echo NO)"
          echo "length:         ${#TOK}   (expected 40)"
          TRIM_TOK="$(printf '%s' "$TOK" | tr -d '[:space:]')"
          echo "length trimmed: ${#TRIM_TOK}"
          if [ "${#TOK}" -ne "${#TRIM_TOK}" ]; then
            echo "VERDICT:        contains whitespace — also broken"
          else
            echo "VERDICT:        no stray whitespace"
          fi
